# Mirrors the app to the Hugging Face Space on every push to main.
#
# Only the files the Space needs are pushed, as a single fresh commit: the Hub
# rejects plain-git binary files (the sample images),
# and the Space doesn't use them anyway.
#
# Setup (once):
#   1. Create a Gradio Space (free ZeroGPU hardware) on huggingface.co,
#      e.g. MA29/ocr-summarizer.
#   2. Create a Hugging Face access token with write permission.
#   3. In this GitHub repo: Settings → Secrets and variables → Actions
#        - Secret   HF_TOKEN  = the token
#        - Variable HF_SPACE  = MA29/ocr-summarizer   (owner/space-name; the full Space URL also works)
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Skip when not configured
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "HF_TOKEN secret or HF_SPACE variable not set; skipping sync."

      - uses: actions/checkout@v4
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''

      - name: Push to the Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          # Accept "owner/name" or the full https://huggingface.co/spaces/owner/name URL.
          space="${HF_SPACE#https://huggingface.co/spaces/}"
          space="${space%/}"
          owner="${space%%/*}"

          mkdir /tmp/space
          cp README.md app.py ocr_backends.py summarizer.py requirements.txt packages.txt /tmp/space/
          cd /tmp/space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Sync from GitHub ${GITHUB_SHA::7}"
          git push --force "https://${owner}:${HF_TOKEN}@huggingface.co/spaces/${space}" main
